
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,
 viewport-fit=cover">
<title>Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  object-fit: cover;
  background: black;
}
</style>
</head>

<body>

<video
 id="video"
 autoplay
 loop
 playsinline
 webkit-playsinline
 preload="auto">
 <source
  src="https://raw.githubusercontent.com/buivietduc07/locket-gold/main/video.mp4"
  type="video/mp4">
</video>


<script>
const video = document.getElementById("video");

video.muted = false;
video.volume = 1;

async function startVideo() {
  try {
    await video.play();
  } catch (error) {
    // Safari chặn phát có tiếng.
    // Cho video tự chạy không tiếng.
    video.muted = true;
    await video.play().catch(console.error);
  }
}

startVideo();

// Chạm một lần vào màn hình để bật tiếng.
document.addEventListener("touchstart", () => {
  video.muted = false;
  video.volume = 1;
  video.play().catch(console.error);
}, { once: true });
</script>


</body>
</html>

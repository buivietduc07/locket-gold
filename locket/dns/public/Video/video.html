
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
    }
  </style>
</head>
<body>

<video
  id="player"
  autoplay
  playsinline
  loop
  controls
  preload="auto">
  <source
    src="https://raw.githubusercontent.com/buivietduc07/locket-gold/main/video.mp4"
    type="video/mp4">
</video>

<script>
  const video = document.getElementById("player");
  video.muted = false;
  video.volume = 1;

  video.play().catch(() => {
    // Trình duyệt chặn autoplay có âm thanh.
    // Thử phát tự động không tiếng.
    video.muted = true;
    video.play().catch(console.error);
  });
</script>

</body>
</html>

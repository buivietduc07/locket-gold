<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebClip Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7; margin: 0; padding: 24px;
    display: flex; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 28px;
    width: 100%; max-width: 520px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #333; }
  input[type=text], input[type=url], input[type=number], input[type=file] {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d4da;
    border-radius: 10px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #007aff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  #preview {
    width: 64px; height: 64px; border-radius: 14px;
    object-fit: cover; margin-top: 10px;
    border: 1px solid #e0e0e0; display: none;
  }
  button {
    width: 100%; margin-top: 24px; padding: 14px;
    background: #007aff; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #0056b3; }
  .hint { font-size: 12px; color: #888; margin-top: 6px; }
  .warn {
    background: #fff8e1; border: 1px solid #ffe082;
    padding: 12px; border-radius: 10px; font-size: 13px;
    color: #7a5c00; margin-top: 18px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>📱 Tạo cấu hình WebClip</h1>

  <label>Tên app (hiện trên màn hình chính)</label>
  <input type="text" id="appName" value="buivduc07" maxlength="14">

  <label>URL mở khi bấm icon</label>
  <input type="url" id="appUrl" value="https://buivduc07.xyz/profile">

  <div class="row">
    <div>
      <label>Số lượng icon</label>
      <input type="number" id="appCount" value="1" min="1" max="1000">
    </div>
    <div>
      <label>Phân biệt URL bằng query</label>
      <input type="text" id="appQuery" value="app">
    </div>
  </div>
  <p class="hint">Nếu số lượng &gt; 1, mỗi icon sẽ có URL dạng <code>?app=1</code>, <code>?app=2</code>… để iOS không gộp lại.</p>

  <label>Icon (PNG, khuyến nghị 180×180 hoặc 512×512)</label>
  <input type="file" id="appIcon" accept="image/png">
  <img id="preview" alt="preview">

  <button onclick="generate()">⬇️ Tải file .mobileconfig</button>

  <div class="warn">
    ⚠️ Người dùng vẫn phải vào <b>Cài đặt → Đã tải xuống</b> để cài và nhập mật khẩu. iOS không cho phép tự động cài.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$('appIcon').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    $('preview').src = ev.target.result;
    $('preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function buildPlist(name, url, count, queryParam, iconData) {
  const iconTag = iconData
    ? `<key>Icon</key><data>${iconData}</data>`
    : '';

  let payloads = '';
  for (let i = 1; i <= count; i++) {
    const finalUrl = count === 1 ? url : `${url}${url.includes('?') ? '&' : '?'}${queryParam}=${i}`;
    payloads += `
      <dict>
        <key>PayloadType</key><string>com.apple.webClip.managed</string>
        <key>PayloadVersion</key><integer>1</integer>
        <key>PayloadIdentifier</key><string>com.buivduc07.webclip.${i}</string>
        <key>PayloadUUID</key><string>${uuid()}</string>
        <key>PayloadDisplayName</key><string>${esc(name)}</string>
        <key>URL</key><string>${esc(finalUrl)}</string>
        <key>Label</key><string>${esc(name)}</string>
        <key>IsRemovable</key><true/>
        <key>FullScreen</key><false/>
        ${iconTag}
      </dict>`;
  }

  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>PayloadType</key><string>Configuration</string>
  <key>PayloadVersion</key><integer>1</integer>
  <key>PayloadIdentifier</key><string>com.buivduc07.profile.generated</string>
  <key>PayloadUUID</key><string>${uuid()}</string>
  <key>PayloadDisplayName</key><string>${esc(name)}</string>
  <key>PayloadOrganization</key><string>buivduc07</string>
  <key>PayloadContent</key>
  <array>${payloads}
  </array>
</dict>
</plist>`;
}

function generate() {
  const name  = $('appName').value.trim() || 'WebApp';
  const url   = $('appUrl').value.trim();
  const count = Math.max(1, Math.min(1000, parseInt($('appCount').value) || 1));
  const query = $('appQuery').value.trim() || 'app';

  if (!url) { alert('Vui lòng nhập URL'); return; }

  const iconFile = $('appIcon').files[0];
  const finish = iconData => {
    const plist = buildPlist(name, url, count, query, iconData);
    const blob = new Blob([plist], { type: 'application/x-apple-aspen-config' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name.replace(/\s+/g,'_')}.mobileconfig`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  if (iconFile) {
    const reader = new FileReader();
    reader.onload = ev => {
      // tách base64 khỏi data URL
      const base64 = ev.target.result.split(',')[1];
      finish(base64);
    };
    reader.readAsDataURL(iconFile);
  } else {
    finish(null);
  }
}
</script>
</body>
</html>
